# Companies to watch. This file is the source of truth for the registry:
#   uv run jobradar companies sync companies.toml
#
# collector: which job platform the company uses: greenhouse, lever or ashby
# board:     the company's slug on that platform:
#              greenhouse: boards.greenhouse.io/<board> or job-boards.greenhouse.io/<board>
#              lever:      jobs.lever.co/<board>
#              ashby:      jobs.ashbyhq.com/<board>
# priority:  1 = check most often, 3 = least often (used by the scheduler slice)
# enabled:   set false to pause a company without losing its history
#
# Removing an entry disables that company (its jobs and history are kept).

[[company]]
name = "Stripe"
collector = "greenhouse"
board = "stripe"
priority = 1

