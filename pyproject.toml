[project]
name = "jobradar"
version = "0.1.0"
description = "New-grad job discovery and matching pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "pypdf>=6.19.0",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]  # schema/ORM warnings are bugs here
markers = [
    "unit: fast, no I/O (no database, no network)",
    "integration: needs PostgreSQL via JOBRADAR_TEST_DATABASE_URL",
]
